<!-- Pre-loader/Progress bar/Spinner -->
<app-loader-container />

<div class="d-flex flex-column w-100 min-h-100">
  <!-- Primary navbar -->
  @if (layoutService.showNavbar()) {
    <app-navbar />
  }

  <div class="router-outlet-container d-flex flex-column grow-1 w-100 h-100">
    <!-- Router Outlet -->
    <router-outlet />
  </div>

  <!-- Footer -->
  @if (layoutService.showFooter()) {
    <app-footer />
  }
</div>
