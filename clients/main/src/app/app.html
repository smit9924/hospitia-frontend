<!-- Pre-loader/Progress bar/Spinner -->
<app-loader-container />

<app-shell [showsNavigation]="showsAppShellNavigation()">
  @if (showsPublicHeader()) {
    <!-- Primary navbar (public pages) -->
    <div appShellPublicHeader class="position-sticky top-0 z-3">
      <app-navbar />
    </div>
  }

  <div class="router-outlet-container d-flex flex-column grow-1 w-100 h-100">
    <!-- Router Outlet -->
    <router-outlet />
  </div>

  @if (showsPublicFooter()) {
    <!-- Footer (public pages) -->
    <div appShellPublicFooter>
      <app-footer />
    </div>
  }
</app-shell>
