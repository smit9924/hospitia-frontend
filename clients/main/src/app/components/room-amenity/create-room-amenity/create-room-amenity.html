<div class="w-100">
  <app-secondary-navbar [titleText]="titleText" [backButton]="true" />

  <main class="d-flex flex-column gap-24 p-24 w-100 align-center">
    <!-- CARD: Room amenity -->
    <mat-card class="form-card w-100">
      <mat-card-header class="mb-16">
        <mat-card-title>
          <h2 class="heading-extra-small m-0">
            @if (isEditMode) {
              <span i18n>Room amenity details</span>
            } @else {
              <span i18n>New room amenity details</span>
            }
          </h2>
        </mat-card-title>
        <mat-card-subtitle class="body-medium text-secondary mt-8">
          <span i18n>Room amenities describe what a room type offers, e.g. a TV or a geyser.</span>
        </mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <app-room-amenity-form [amenityGuid]="amenityGuid" (saved)="onAmenitySaved()" />
      </mat-card-content>
    </mat-card>
  </main>
</div>
