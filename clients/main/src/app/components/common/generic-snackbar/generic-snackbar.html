<div class="d-flex justify-space-between align-center gap-16">
  <span class="d-flex align-center gap-8" matSnackBarLabel>
    <mat-icon svgIcon="{{ TYPE_META[data.type].icon }}" class="max-w-fit"></mat-icon>

    <span class="snackbar-text">
      {{ data.text }}
    </span>
  </span>

  <span matSnackBarActions>
    @if (data.showCloseButton) {
      <button
        matIconButton
        aria-label="Close snackbar"
        class="close-button rounded-full p-0 d-flex align-center justify-center"
        [matTooltip]="'Close snackbar'"
        (click)="dismiss()"
      >
        <mat-icon svgIcon="cancel" class="cross-icon d-flex justify-center align-center" />
      </button>
    }
  </span>
</div>
