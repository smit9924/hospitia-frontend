<nav class="public-header" aria-label="Main" i18n-aria-label>
  <div class="public-header-inner">
    <!-- Brand Logo -->
    <img
      ngSrc="assets/logo/logo-full.png"
      class="public-header-logo"
      width="126"
      height="42"
      alt="Hospitia"
      i18n-alt
      priority
    />

    @if (authService.isLoggedIn) {
      <!-- BUTTON: Go to dashboard -->
      <a matButton="filled" i18n [routerLink]="dashboardLink()">Go to dashboard</a>
    } @else {
      <!-- Section: Auth actions (desktop) -->
      <div class="public-header-actions">
        <!-- BUTTON: Log in -->
        <a matButton="filled" i18n [routerLink]="loginLink">Log in</a>
        <!-- BUTTON: Sign up -->
        <a matButton="outlined" class="button-quiet" i18n [routerLink]="signupLink">Sign up</a>
      </div>

      <!-- BUTTON: Menu (mobile) -->
      <button
        matIconButton
        type="button"
        class="public-header-menu-button"
        aria-label="Menu"
        i18n-aria-label
        matTooltip="Menu"
        i18n-matTooltip
        [matMenuTriggerFor]="publicLinksMenu"
      >
        <mat-icon svgIcon="menu" aria-hidden="true" />
      </button>

      <!-- Menu: Auth links (mobile) -->
      <mat-menu #publicLinksMenu="matMenu" xPosition="before">
        <a mat-menu-item i18n [routerLink]="loginLink">Log in</a>
        <a mat-menu-item i18n [routerLink]="signupLink">Sign up</a>
      </mat-menu>
    }
  </div>
</nav>
