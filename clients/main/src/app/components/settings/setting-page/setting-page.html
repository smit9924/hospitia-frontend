<div class="w-100">
  <app-page-header [titleText]="titleText" />

  <div class="page-container settings-card-grid">
    @for (setting of settings; track setting.id) {
      <a
        class="settings-card d-flex align-center gap-16 p-16"
        [routerLink]="setting.route"
        [attr.aria-label]="setting.title"
      >
        <span class="settings-card-icon" aria-hidden="true">
          <mat-icon [svgIcon]="setting.icon" />
        </span>

        <div class="grow-1 overflow-hidden">
          <div class="heading-tiny mb-8 clamp-1">
            {{ setting.title }}
          </div>

          <div class="body-medium text-secondary wb-break-word clamp-2">
            {{ setting.description }}
          </div>
        </div>

        <mat-icon svgIcon="arrowRight" class="text-secondary shrink-0" aria-hidden="true" />
      </a>
    }
  </div>
</div>
