<div class="status-page">
  <div class="status-page-text">
    <h1 class="body-large text-secondary" i18n>404 Not Found</h1>
    <p class="heading-large" i18n>Oops! Page not found</p>
    <p class="body-large text-secondary" i18n>
      The page you are looking for does not exist. Click button below to go to the homepage.
    </p>
  </div>

  <!-- BUTTON: Login -->
  <button
    mat-raised-button
    matButton="filled"
    type="button"
    i18n
    (click)="profileService.redirectToDefaultHome()"
  >
    Back to Homepage
  </button>
</div>
