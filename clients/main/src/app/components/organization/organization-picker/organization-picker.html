<!-- AUTOCOMPLETE: Organization -->
<mat-form-field subscriptSizing="dynamic" class="w-100">
  <mat-label>{{ label() }}</mat-label>
  <input
    matInput
    type="text"
    autocomplete="off"
    [formControl]="searchControl"
    [placeholder]="placeholder()"
    [required]="isRequired()"
    [matAutocomplete]="organizationAutocomplete"
    [errorStateMatcher]="errorStateMatcher"
    (blur)="onInputBlur()"
  />
  <mat-autocomplete
    #organizationAutocomplete="matAutocomplete"
    [displayWith]="displayOrganizationName"
    (optionSelected)="onOrganizationSelected($event)"
  >
    @if (isSearching()) {
      <mat-option disabled i18n>Searching...</mat-option>
    } @else {
      @for (organization of organizationOptions(); track organization.guid) {
        <mat-option [value]="organization">{{ organization.name }}</mat-option>
      } @empty {
        <mat-option disabled i18n>No organizations found</mat-option>
      }
    }
  </mat-autocomplete>
  @if (hint()) {
    <mat-hint>{{ hint() }}</mat-hint>
  }
  @if (control().hasError('required')) {
    <mat-error>{{ requiredErrorText() }}</mat-error>
  }
</mat-form-field>
